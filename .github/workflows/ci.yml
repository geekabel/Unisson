name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  check:
    # Same release as the target machine, so GStreamer 1.20 is what gets tested.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer and the Tauri system libraries
        run: |
          sudo apt-get update
          # libunwind-dev is listed first on purpose: on the ubuntu-22.04
          # runner image, apt cannot resolve it by itself as a dependency
          # of libgstreamer1.0-dev.
          sudo apt-get install -y --no-install-recommends libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Tauri is a large dependency: keep its build between runs.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check the documentation
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the JavaScript helpers of the interface
        run: node --test crates/unisson-app/ui-tests/*.test.mjs
