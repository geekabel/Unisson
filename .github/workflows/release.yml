name: Release
# Publishes a version: a tag such as v0.1.0 builds the installers and
# creates the release on GitHub. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Each job only reads the repository, except the last one, which publishes.
permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: read
        name: Compare the tag with the version of the workspace
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG, but Cargo.toml says version $version."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Debian package
    needs: version
    # The oldest release Unisson supports: see package.yml.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install GStreamer and the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # No cache here: what is published is built from the sources alone.
      - name: Install the Tauri command line tool
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the package
        working-directory: crates/unisson-app
        run: cargo tauri build --bundles deb -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows installer (experimental)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install GStreamer
        shell: pwsh
        run: .github/scripts/install-gstreamer.ps1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install the Tauri command line tool
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        shell: bash
        working-directory: crates/unisson-app
        run: ../../.github/scripts/run-and-report.sh "Windows installer" cargo tauri build --bundles nsis -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    # Linux is required. Windows is experimental: a release goes out
    # without its installer rather than not at all.
    needs: [version, linux, windows]
    if: ${{ always() && needs.version.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Write the checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Take the notes of this version from the changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## \[/ { printing = ($0 ~ "^## \\[" version "\\]") ; next }
            /^\[[^]]+\]: / { next }
            printing' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A version below 1.0.0, or with a suffix such as -rc.1, is
          # marked as a pre-release only when it has a suffix.
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" assets/* --title "Unisson ${TAG#v}" --notes-file notes.md $flags
