# Espace de travail Unisson.
# Référence : https://doc.rust-lang.org/cargo/reference/workspaces.html
[workspace]
members = ["crates/*"]
# Un manifeste virtuel doit fixer le résolveur. "3" va avec l'édition 2024.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Les plugins Tauri 2 demandent Rust 1.90 au minimum.
rust-version = "1.90"
repository = "https://github.com/geekabel/Unisson"
description = "Lecteur audio unifié pour Linux : radio, fichiers locaux, YouTube."

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
