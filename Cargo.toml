# Unisson workspace.
# Reference: https://doc.rust-lang.org/cargo/reference/workspaces.html
[workspace]
members = ["crates/*"]
# A virtual manifest must set the resolver explicitly. "3" matches edition 2024.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Tauri 2 plugins require Rust 1.90 or newer.
rust-version = "1.90"
repository = "https://github.com/geekabel/Unisson"
description = "Unified audio player for Linux: internet radio, local files, YouTube."

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
unisson-core = { path = "crates/unisson-core", version = "0.1.0" }
# GStreamer bindings. Default features target the GStreamer 1.14 API, which
# keeps the build compatible with Ubuntu 22.04 (GStreamer 1.20).
gst = { package = "gstreamer", version = "0.25" }
