[package]
name = "unisson-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Unisson desktop application: the window, built with Tauri."
# The program that `cargo run -p unisson-app` starts.
default-run = "unisson"

[lints]
workspace = true

[[bin]]
name = "unisson"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
unisson-audio.workspace = true
unisson-core.workspace = true
unisson-local.workspace = true
unisson-playback.workspace = true
unisson-radio.workspace = true
unisson-store.workspace = true
unisson-youtube.workspace = true
serde.workspace = true
# "tray-icon": the icon in the top bar of the desktop.
tauri = { version = "2", features = ["tray-icon"] }
# Native dialogs: the folder picker of the settings.
tauri-plugin-dialog = "2"
# Starting Unisson again talks to the copy that is already open.
tauri-plugin-single-instance = "2"
# MPRIS: the D-Bus interface the desktop uses for the media keys and for
# showing what plays. It runs on its own thread, with a small executor.
mpris-server = "0.10"
async-channel = "2"
async-executor = "1"
futures-lite = "2"
# The settings file is written in TOML, which is easy to read and to edit.
toml = "1"

[dev-dependencies]
serde_json.workspace = true
