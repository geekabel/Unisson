<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unisson</title>
<link rel="stylesheet" href="styles/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<!-- Icons, defined once and reused with <use>. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5h-5.5V14h-5v5.5H4z"/></symbol>
  <symbol id="icon-radio" viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11" rx="2"/><path d="M7 9l9-5M7 13h3M7 16h3"/><circle cx="15.5" cy="14.5" r="2.5"/></symbol>
  <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="icon-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="icon-sources" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="icon-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6l-5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/></symbol>
  <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6l-5 4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="icon-queue" viewBox="0 0 24 24"><path d="M4 7h12M4 12h12M4 17h7"/><path d="M16 15v5l4.5-2.5z"/></symbol>
  <symbol id="icon-bars" viewBox="0 0 24 24"><path d="M6 15V9M12 19V5M18 16V8"/></symbol>
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="icon-video" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="3"/><path d="M10.5 9.5v5l4.5-2.5z"/></symbol>
  <symbol id="icon-list" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="icon-list-add" viewBox="0 0 24 24"><path d="M4 7h12M4 12h8M4 17h6"/><path d="M17 12v8M13 16h8"/></symbol>
  <symbol id="icon-mini" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><rect x="12" y="12" width="6" height="4.5" rx="1"/></symbol>
  <symbol id="icon-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol>
  <symbol id="icon-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
  <!-- Filled icons. -->
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
  <symbol id="icon-previous" viewBox="0 0 24 24"><path d="M18 6.5v11l-8-5.5zM5.5 6h2v12h-2z"/></symbol>
  <symbol id="icon-next" viewBox="0 0 24 24"><path d="M6 6.5v11l8-5.5zM16.5 6h2v12h-2z"/></symbol>
</svg>

<div class="app">

  <nav class="sidebar" aria-label="Navigation principale">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#F5B841"/><path d="M8 17v-6M12 20V8M16 18v-8M20 16v-4" stroke="#1A1300" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="brand-name">Unisson</span>
    </div>

    <div class="nav-group">
      <button class="nav-item" type="button" data-view="home" title="Accueil">
        <svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg><span class="nav-label">Accueil</span>
      </button>
      <button class="nav-item" type="button" data-view="radios" title="Radios">
        <svg class="icon" aria-hidden="true"><use href="#icon-radio"/></svg><span class="nav-label">Radios</span>
      </button>
      <button class="nav-item" type="button" data-view="favorites" title="Favoris">
        <svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg><span class="nav-label">Favoris</span>
      </button>
      <button class="nav-item" type="button" data-view="history" title="Historique">
        <svg class="icon" aria-hidden="true"><use href="#icon-history"/></svg><span class="nav-label">Historique</span>
      </button>
    </div>

    <div class="nav-group" id="playlists-nav" hidden>
      <div class="nav-heading">Mes listes</div>
      <div class="nav-group" id="playlists-list"></div>
      <button class="nav-item nav-item-soft" id="playlist-new" type="button" title="Nouvelle liste">
        <svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg><span class="nav-label">Nouvelle liste</span>
      </button>
    </div>

    <div class="nav-group nav-group-end">
      <button class="nav-item" type="button" data-view="sources" title="Sources">
        <svg class="icon" aria-hidden="true"><use href="#icon-sources"/></svg><span class="nav-label">Sources</span><span class="nav-count" id="sources-count"></span>
      </button>
    </div>
  </nav>

  <main class="content">
    <form class="search" id="search-form" role="search">
      <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false"
        aria-label="Rechercher dans toutes les sources"
        placeholder="Un titre, un artiste, une radio, ou collez un lien">
      <kbd>Ctrl K</kbd>
    </form>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <aside class="queue" id="queue" aria-label="File d'attente" hidden>
    <div class="queue-head">
      <h2 class="section-title">File d'attente</h2>
      <button class="text-button" id="queue-clear" type="button">Vider</button>
    </div>
    <div class="queue-body" id="queue-body"></div>
    <div class="queue-fallback" id="queue-fallback"></div>
  </aside>

  <div class="notice" id="notice" role="status" aria-live="polite" hidden>
    <span class="notice-text" id="notice-text"></span>
    <button class="text-button" id="notice-action" type="button" hidden></button>
    <button class="icon-button" id="notice-close" type="button" aria-label="Fermer le message">
      <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
    </button>
  </div>

  <footer class="player" aria-label="Lecteur">
    <div class="player-media">
      <div class="cover" id="player-cover" data-source="none">
        <svg class="icon" aria-hidden="true"><use id="player-cover-icon" href="#icon-note"/></svg>
        <img id="player-cover-image" alt="" hidden>
      </div>
      <div class="player-text">
        <div class="player-title" id="player-title">Rien en lecture</div>
        <div class="player-subtitle" id="player-subtitle">Choisissez un titre ou collez un lien</div>
      </div>
      <span class="badge" id="player-source" hidden></span>
    </div>

    <div class="player-center">
      <div class="transport">
        <button class="icon-button" id="player-previous" type="button" aria-label="Titre précédent" disabled>
          <svg class="icon icon-filled" aria-hidden="true"><use href="#icon-previous"/></svg>
        </button>
        <button class="play-button" id="player-toggle" type="button" aria-label="Lire" disabled>
          <svg class="icon icon-filled" aria-hidden="true"><use id="player-toggle-icon" href="#icon-play"/></svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <button class="icon-button" id="player-next" type="button" aria-label="Titre suivant" disabled>
          <svg class="icon icon-filled" aria-hidden="true"><use href="#icon-next"/></svg>
        </button>
      </div>
      <div class="progress" id="player-progress">
        <span class="time" id="player-position">0:00</span>
        <input class="slider" id="player-seek" type="range" min="0" max="0" step="1000" value="0"
          aria-label="Position dans le titre" disabled>
        <span class="time" id="player-duration">0:00</span>
      </div>
      <div class="live" id="player-live" hidden><span class="live-dot" aria-hidden="true"></span>En direct</div>
    </div>

    <div class="player-tools">
      <button class="icon-button favorite-button" id="player-favorite" type="button"
        aria-label="Ajouter aux favoris" title="Ajouter aux favoris" aria-pressed="false" disabled>
        <svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg>
      </button>
      <button class="icon-button" id="player-mute" type="button" aria-label="Couper le son" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use id="player-mute-icon" href="#icon-volume"/></svg>
      </button>
      <input class="slider slider-volume" id="player-volume" type="range" min="0" max="100" step="1" value="100"
        aria-label="Volume">
      <button class="icon-button" id="player-mini" type="button"
        aria-label="Réduire en mini-lecteur" title="Réduire en mini-lecteur">
        <svg class="icon" aria-hidden="true"><use href="#icon-mini"/></svg>
      </button>
      <button class="icon-button toggle-button" id="player-queue" type="button"
        aria-label="File d'attente" title="File d'attente" aria-pressed="false" aria-controls="queue">
        <svg class="icon" aria-hidden="true"><use href="#icon-queue"/></svg>
      </button>
    </div>
  </footer>

</div>
</body>
</html>
